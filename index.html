</head>
<body>
<header class="masthead"><span class="monogram" aria-hidden="true">✿</span><span data-copy="brand">The Garden We Grew</span><span class="edition">Prototype 02</span></header>
<main id="app" hidden>
<section class="intro">
<div class="intro-copy"><p class="kicker" data-copy="eyebrow"></p><h1 data-copy="title"></h1><p class="intro-description" data-copy="intro"></p><button type="button" id="openGate" class="button primary" aria-controls="gardenPath" aria-expanded="false" data-copy="enter"></button></div>
<div class="hero-art" aria-hidden="true">
<svg viewBox="0 0 360 330" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e6eee0"/><stop offset="1" stop-color="#f6e4cc"/></linearGradient></defs>

<path d="M31 257Q120 198 180 242T329 225V300H31Z" fill="#89a087"/>

<g stroke="#607861" fill="none" stroke-width="3"><path d="M65 286V141Q65 38 180 38Q295 38 295 141V286"/><path d="M78 286V140Q78 50 180 50Q282 50 282 140V286"/><path d="M65 181H78M282 181H295M65 243H78M282 243H295"/></g>

</svg>
</div></section>
<div id="gardenJourney" hidden>
<section id="gardenPath" class="scene path-scene" tabindex="-1" aria-labelledby="pathTitle">
 <div class="scene-heading"><p class="kicker" data-copy="pathKicker"></p><h2 id="pathTitle" data-copy="pathTitle"></h2><p data-copy="pathIntro"></p></div>
 <div class="scene-picture"><svg viewBox="0 0 600 320" role="img" aria-label="A winding garden path with flowers growing beside it" xmlns="http://www.w3.org/2000/svg">
 <defs><linearGradient id="pathSky" x2="0" y2="1"><stop stop-color="#e7eee1"/><stop offset="1" stop-color="#f6dfc9"/></linearGradient><linearGradient id="pathGround" x2="0" y2="1"><stop stop-color="#a9bb98"/><stop offset="1" stop-color="#789176"/></linearGradient></defs>
 <rect width="600" height="320" fill="url(#pathSky)"/><circle cx="452" cy="69" r="33" fill="#fff1ce"/><path d="M0 167Q110 78 228 157T600 132V320H0Z" fill="#c0cead"/><path d="M0 205Q175 130 301 190T600 175V320H0Z" fill="url(#pathGround)"/><path d="M235 320Q365 253 304 219Q270 197 336 172L360 172Q309 198 331 214Q415 250 415 320Z" fill="#e7d0ae"/><path d="M260 312L381 312M284 288L373 283M308 265L357 259M322 241L335 239" stroke="#bdab8c" stroke-width="1.5" opacity=".7"/>

 <div class="scene-caption"><p id="pathProgress" aria-live="polite"></p><a class="button secondary" href="#nursery" data-copy="visitNursery"></a></div>
</section>
<section id="nursery" class="section">
<div class="section-head"><span class="chapter">I.</span><div><p class="kicker" data-copy="nurseryKicker"></p><h2 data-copy="nurseryTitle"></h2><p data-copy="nurseryIntro"></p></div></div>
<div class="progress"><span id="progressText"></span><progress id="progress" value="0" max="6" aria-label="Flowers in bloom"></progress></div>
<div id="plants" class="plant-grid"></div>
</section>
<section class="scene greenhouse-scene" aria-labelledby="glassTitle"><div class="scene-heading"><p class="kicker" data-copy="glassKicker"></p><h2 id="glassTitle" data-copy="glassTitle"></h2><p data-copy="glassIntro"></p></div><div class="scene-picture"><svg viewBox="0 0 600 300" role="img" aria-label="A glass greenhouse surrounded by flowers" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="glassSky" x2="0" y2="1"><stop stop-color="#e7efdd"/><stop offset="1" stop-color="#f7e6ce"/></linearGradient></defs><rect width="600" height="300" fill="url(#glassSky)"/><path d="M0 220Q150 167 300 216T600 206V300H0Z" fill="#acbd9e"/><path d="M240 300L273 223H327L365 300Z" fill="#dfc6a3"/><path d="M105 235V98L300 35L495 98V235Z" fill="#dae8de" fill-opacity=".65" stroke="#607b68" stroke-width="5"/><path d="M105 98H495M300 35V98M148 84V235M202 66V235M251 51V235M349 51V235M398 66V235M452 84V235M105 145H495M105 190H495" stroke="#789683" stroke-width="2" fill="none"/><path d="M260 235V116H340V235M300 116V235" fill="#d2dfcd" stroke="#58755e" stroke-width="3"/><circle cx="289" cy="182" r="3" fill="#b69b6c"/><circle cx="310" cy="182" r="3" fill="#b69b6c"/><path d="M94 241H506" stroke="#b89d79" stroke-width="7"/><g id="glassPlants"></g></svg></div><div class="scene-caption"><a class="button secondary" href="#greenhouse" data-copy="enterGlass"></a></div></section>
<section id="greenhouse" class="section">
<div class="section-head"><span class="chapter">II.</span><div><p class="kicker" data-copy="bouquetKicker"></p><h2 data-copy="bouquetTitle"></h2><p data-copy="bouquetIntro"></p></div></div>
<div class="bouquet-workspace"><div class="bouquet-paper"><div id="bouquetArt" class="bouquet-art"></div><p id="bouquetCount"></p></div>
<div class="bouquet-controls"><h3 data-copy="arrangeTitle"></h3><p data-copy="arrangeHint"></p><div id="arrangement"></div><label for="wrap" data-copy="wrapLabel"></label><select id="wrap"></select><label for="ribbon" data-copy="ribbonLabel"></label><select id="ribbon"></select><label class="check"><input type="checkbox" id="greenery"><span data-copy="greeneryLabel"></span></label><div class="button-row"><button type="button" id="png" data-copy="savePng"></button><button type="button" id="svg" class="secondary" data-copy="saveSvg"></button></div><p class="quiet" data-copy="exportHint"></p></div></div>
</section>
<section id="finalGarden" class="scene final-scene" aria-labelledby="finalTitle"><div class="scene-heading"><p class="kicker" data-copy="finalKicker"></p><h2 id="finalTitle" data-copy="finalTitle"></h2><p data-copy="finalIntro"></p></div><div class="scene-picture"><svg viewBox="0 0 600 330" role="img" aria-label="A garden bench underneath a flowering tree at sunset" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="finalSky" x2="0" y2="1"><stop stop-color="#b8c4bc"/><stop offset=".7" stop-color="#f0d4ba"/><stop offset="1" stop-color="#f9e8cd"/></linearGradient></defs><rect width="600" height="330" fill="url(#finalSky)"/><circle cx="439" cy="115" r="37" fill="#ffedbe"/><path d="M0 232Q165 152 314 220T600 204V330H0Z" fill="#92a889"/><path d="M0 282Q150 248 300 281T600 271V330H0Z" fill="#779176"/><path d="M160 281Q184 202 171 145Q156 110 118 87L126 78Q173 97 188 132Q202 91 247 76L255 85Q206 112 205 159L199 281Z" fill="#806c52"/><g id="treeBlooms"></g><g stroke="#715d48" stroke-width="5" stroke-linecap="round" fill="none"><path d="M237 248H396M243 256H390M246 264H387M240 275H395M252 275V302M381 275V302M252 248V275M381 248V275M235 268H401M237 268V282M399 268V282"/></g><g id="finalPlants"></g></svg><div id="finalEffects" class="scene-effects" aria-hidden="true"></div></div><div class="scene-caption"><p id="letterStatus" aria-live="polite"></p><button id="openLetter" type="button" aria-expanded="false" aria-controls="gardenLetter" data-copy="openLetter" disabled></button></div><div id="gardenLetter" class="garden-letter" hidden tabindex="-1"><span class="closing-mark" aria-hidden="true">❦</span><h3 data-copy="letterHeading"></h3><p data-copy="letterBody"></p><p class="signature" data-copy="letterSign"></p></div></section>
<section class="closing"><span class="closing-mark" aria-hidden="true">❦</span><h2 data-copy="closingTitle"></h2><p data-copy="closing"></p></section>
</div>
<footer><p data-copy="privacy"></p><button type="button" class="text-button" id="reset" data-copy="reset"></button></footer>
</main>
