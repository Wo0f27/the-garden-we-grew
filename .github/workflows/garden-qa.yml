name: Garden browser QA
on:
  push:
    branches: [main, v9-expansion]
    paths:
      - '**.js'
      - '**.cjs'
      - '**.html'
      - 'styles/**'
      - 'tests/**'
      - '.github/workflows/garden-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GARDEN_QA_OUTPUT: qa-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Model tests
        run: node tests/model.test.cjs
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.65.2
          if command -v google-chrome >/dev/null; then
            echo "GARDEN_QA_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Exercise garden in Chromium
        run: python tests/browser_qa.py
      - name: Retain browser screenshots and exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-browser-qa
          path: qa-output/
          retention-days: 7
          if-no-files-found: ignore
